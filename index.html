<!-- Optional ambient matrix rain background -->
<script>
(function(){
	const cvs = document.createElement('canvas');
	Object.assign(cvs.style,{ position:'fixed', inset:'0', zIndex:'-1' });
	document.body.appendChild(cvs);
	const ctx = cvs.getContext('2d');
	let w,h,cols,ys;
	function resize(){
		w=cvs.width=window.innerWidth; h=cvs.height=window.innerHeight;
		cols=Math.floor(w/14); ys=Array(cols).fill(0);
	}
	window.addEventListener('resize',resize); resize();
	function frame(){
		ctx.fillStyle='rgba(10,15,13,0.25)';
		ctx.fillRect(0,0,w,h);
		ctx.fillStyle='#52ffa8';
		ctx.font='14px JetBrains Mono';
		ys.forEach((y,i)=>{
			const t=String.fromCharCode(0x30A0+Math.random()*96);
			ctx.fillText(t,i*14,y);
			ys[i]= y>h+Math.random()*1000 ? 0 : y+18;
		});
		requestAnimationFrame(frame);
	}
	frame();
})();
</script>
